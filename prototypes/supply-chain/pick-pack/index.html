    function renderPickDetail() {
      const pl = STATE.pickLists.find(p => p.id === activePickId);
      if (!pl) return;
      const fo = STATE.fos.find(f => f.id === pl.foId);
      document.getElementById('pdTitle').textContent = pl.id;
      document.getElementById('pdSub').textContent = `Linked to ${pl.foId}`;
      const p = pickProgress(pl);

      const meta = `
        <div class="items-table">
          <div class="items-table-hdr">
            <div>
              <div class="items-table-title">${pl.project}</div>
              <div class="items-table-sub">FO ${pl.foId} · ${titleCase(fo ? fo.priority : 'STANDARD')}</div>
            </div>
            <span class="status-pill ${pl.status === 'DONE' ? 'green' : pl.status === 'IN_PROGRESS' ? 'blue' : 'gray'}">
              <span class="dot"></span>${pl.status === 'IN_PROGRESS' ? 'IN PROGRESS' : pl.status}
            </span>
          </div>
          <div style="padding: 12px 14px;">
            <div class="kv-grid">
              <span class="k">Picker</span><span class="v">${pl.picker}</span>
              <span class="k">Job location</span><span class="v">${fo && fo.driver ? fo.driver : '—'}</span>
            </div>
          </div>
        </div>

        <div style="padding: 12px 14px; background: var(--bg-weak); border-radius: 10px; margin-bottom: 12px;">
          <div class="progress">
            <span class="progress-text" style="font-size: 12px;">${p.doneLines} of ${p.totalLines} items picked</span>
            <span class="progress-pct" style="font-size: 12px;">${p.pickedQty} / ${p.totalQty} qty</span>
          </div>
          <div class="progress-bar" style="margin-top: 6px; height: 6px;"><div class="progress-fill ${p.pct < 100 ? 'warning' : ''}" style="width: ${p.pct}%;"></div></div>
        </div>

        <div class="items-table">
          <div class="items-table-hdr">
            <div class="items-table-title">Line items</div>
            <span class="items-table-sub">${pl.items.length} line${pl.items.length !== 1 ? 's' : ''}</span>
          </div>
          ${pl.items.map((it, idx) => renderPickLine(it, idx, pl.status === 'DONE')).join('')}
        </div>
      `;
      document.getElementById('pickDetailBody').innerHTML = meta;

      // Footer state
      const footer = document.getElementById('pickFooter');
      const allPicked = pl.items.every(i => i.picked >= i.need && !i.flag);
      const anyPicked = pl.items.some(i => i.picked > 0 || i.flag);
      if (pl.status === 'DONE') {
        footer.style.display = 'none';
      } else {
        footer.style.display = 'flex';
        document.getElementById('pdCompleteBtn').disabled = !allPicked;
      }
    }

    function renderPickLine(it, idx, readOnly) {
      const isDone = it.picked >= it.need && !it.flag;
      const isFlagged = !!it.flag;
      // In read-only mode, don't tint each line green — the DONE status pill and
      // full progress bar at top already convey completion; per-line green is noise.
      const cls = readOnly ? (isFlagged ? 'flagged' : '') : (isDone ? 'done' : isFlagged ? 'flagged' : '');
      const actions = readOnly
        ? `
          <div class="pl-actions pl-actions-ro">
            <div class="pl-ro-summary">
              <span class="pl-ro-label">Picked</span>
              <span class="pl-ro-value">${it.picked} <span class="pl-ro-of">/ ${it.need}</span></span>
            </div>
            ${isFlagged
              ? `<span class="pl-ro-flag"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>${it.flag}${it.flagQty ? ` · ${it.flagQty}` : ''}</span>`
              : `<span class="pl-ro-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>`}
          </div>`
        : `
          <div class="pl-actions">
            <div class="qty-stepper">
              <button onclick="adjustPickQty(${idx}, -1)" ${it.picked === 0 ? 'disabled' : ''}>−</button>
              <input type="number" value="${it.picked}" min="0" max="${it.need}" onchange="setPickQty(${idx}, this.value)" />
              <button onclick="adjustPickQty(${idx}, +1)" ${it.picked >= it.need ? 'disabled' : ''}>+</button>
            </div>
            <button class="pl-flag-btn ${isFlagged ? 'active' : ''}" onclick="openExceptionSheet(${idx})">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
              ${isFlagged ? `${it.flag}${it.flagQty ? ` · ${it.flagQty}` : ''}` : 'Flag'}
            </button>
          </div>`;
      return `
        <div class="pick-line ${cls}">
          <div class="pl-head">
            <span class="pl-num">${idx + 1}</span>
            <div class="pl-info">
              <div class="pl-name">${it.name}</div>
              <div class="pl-sku">SKU ${it.sku}</div>
              <div class="pl-meta">
                <span>Location: <strong>${it.location || '—'}</strong></span>
                <span>Need: <strong>${it.need}</strong></span>
              </div>
            </div>
          </div>
          ${actions}
          ${isFlagged && it.note ? `<div class="pl-exception-note"><b>${it.flag}</b> · ${it.note}</div>` : ''}
        </div>
      `;
    }

    function adjustPickQty(idx, delta) {
      const pl = STATE.pickLists.find(p => p.id === activePickId);
      const it = pl.items[idx];
      it.picked = Math.max(0, Math.min(it.need, it.picked + delta));
      if (it.picked > 0 && pl.status === 'ASSIGNED') pl.status = 'IN_PROGRESS';
      renderPickDetail();
    }
    function setPickQty(idx, val) {
      const pl = STATE.pickLists.find(p => p.id === activePickId);
      const it = pl.items[idx];
      const n = Math.max(0, Math.min(it.need, parseInt(val || '0', 10)));
      it.picked = isNaN(n) ? 0 : n;
      if (it.picked > 0 && pl.status === 'ASSIGNED') pl.status = 'IN_PROGRESS';
      renderPickDetail();
    }

    function openExceptionSheet(idx) {
      const pl = STATE.pickLists.find(p => p.id === activePickId);
      const it = pl.items[idx];
      const types = ['Damaged', 'Missing', 'Wrong Item', 'Short'];
      tmpExType = it.flag || null;
      const remaining = Math.max(1, it.need - (it.picked || 0));
      tmpExQty = (typeof it.flagQty === 'number' && it.flagQty > 0) ? it.flagQty : remaining;
      const body = `
        <p style="font-size: 12px; color: var(--text-sub); margin-bottom: 12px;">
          ${it.name} (SKU ${it.sku}) · Need <b style="color:var(--text-strong);">${it.need}</b> · Picked <b style="color:var(--text-strong);">${it.picked || 0}</b>
        </p>
        <div style="font-size: 12px; color: var(--text-sub); font-weight: 600; margin-bottom: 6px;">Exception type</div>
        <div class="chip-grid" id="exTypeGrid">
          ${types.map(t => `<button class="chip-opt ${tmpExType === t ? 'active' : ''}" data-type="${t}" onclick="setExType('${t}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            ${t}
          </button>`).join('')}
        </div>
        <div class="merlin-text-field" style="margin-bottom: 12px;">
          <label class="input-label">Problem quantity <span class="required">*</span></label>
          <div class="qty-stepper" id="exQtyStepper" style="width:100%;">
            <button type="button" onclick="adjustExQty(-1)">−</button>
            <input type="number" id="exQty" value="${tmpExQty}" min="1" max="${it.need}" onchange="setExQty(this.value, ${it.need})" />
            <button type="button" onclick="adjustExQty(1, ${it.need})">+</button>
          </div>
          <div class="hint-text" style="margin-top:6px;">How many units have this issue (damaged, missing, wrong, short).</div>
        </div>
        <div class="merlin-text-field" style="margin-bottom: 0;">
          <label class="input-label">Note <span class="optional">optional</span></label>
          <div class="input-wrapper multiline">
            <textarea id="exNote" placeholder="Add detail (e.g. 'pallet wrap torn, 6 sheets cracked')">${it.note || ''}</textarea>
          </div>
        </div>
      `;
      openSheet('Flag exception', body, [
        { label: 'Clear', cls: 'btn-natural outlined', onClick: `clearException(${idx})` },
        { label: 'Save', cls: 'btn-primary', onClick: `saveException(${idx})` },
      ]);
    }

    let tmpExType = null;
    let tmpExQty = 0;
    function setExType(t) {
      tmpExType = t;
      document.querySelectorAll('#exTypeGrid .chip-opt').forEach(c => {
        c.classList.toggle('active', c.dataset.type === t);
      });
    }
    function setExQty(val, max) {
      const n = Math.max(1, Math.min(max, parseInt(val || '0', 10)));
      tmpExQty = isNaN(n) ? 1 : n;
      document.getElementById('exQty').value = tmpExQty;
    }
    function adjustExQty(delta, max) {
      const cap = (typeof max === 'number') ? max : Infinity;
      tmpExQty = Math.max(1, Math.min(cap, tmpExQty + delta));
      document.getElementById('exQty').value = tmpExQty;
    }
    function saveException(idx) {
      const pl = STATE.pickLists.find(p => p.id === activePickId);
      const it = pl.items[idx];
      if (!tmpExType) { showToast('Pick an exception type', 'warning'); return; }
      if (!tmpExQty || tmpExQty < 1) { showToast('Enter problem quantity', 'warning'); return; }
      it.flag = tmpExType;
      it.flagQty = tmpExQty;
      it.note = document.getElementById('exNote').value.trim();
      if (pl.status === 'ASSIGNED') pl.status = 'IN_PROGRESS';
      tmpExType = null; tmpExQty = 0;
      closeSheet();
      renderPickDetail();
      showToast('Exception flagged', 'warning');
    }
    function clearException(idx) {
      const pl = STATE.pickLists.find(p => p.id === activePickId);
      pl.items[idx].flag = null;
      pl.items[idx].flagQty = 0;
      pl.items[idx].note = '';
      tmpExType = null;
      closeSheet();
      renderPickDetail();
    }

    function confirmPick(kind) {
      const pl = STATE.pickLists.find(p => p.id === activePickId);
      if (!pl) return;
      pl.status = 'DONE';
      const fo = STATE.fos.find(f => f.id === pl.foId);
      if (fo) {
        // Move FO from IN_PICK → READY (or shortage state if partial)
        pl.items.forEach(it => {
          const foItem = fo.items.find(x => x.sku === it.sku);
          if (foItem) {
            foItem.picked = it.picked;
            foItem.packed = it.picked;
          }
        });
        fo.status = kind === 'partial' ? 'READY' : 'READY';
        fo.activity.push({ who: pl.picker, when: 'Today, ' + nowTime(), kind: 'Status changed', body: 'IN_PICK → READY' });
        if (kind === 'partial') {
          fo.activity.push({ who: pl.picker, when: 'Today, ' + nowTime(), kind: 'Pick partial', body: 'Remainder of FO created' });
        }
      }
      showToast(kind === 'partial' ? 'Pick partial saved · remainder FO created' : 'Pick complete');
      goBack();
    }

    /* ============================================================
       SCREEN 3: ORDERS DASHBOARD
       ============================================================ */
    let orderTab = 'approval';

    function setOrderTab(t) {
      orderTab = t;
      document.querySelectorAll('#orderSeg .seg-opt').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === t);
      });
      renderOrders();
    }

    function statusPillFor(status) {
      const map = {
        'NEW': ['gray', 'New'],
        'IN_PICK': ['blue', 'In Pick'],
        'READY': ['green', 'Ready to Dispatch'],
        'IN_TRANSIT': ['feature', 'In Transit'],
        'DELIVERED': ['green', 'Delivered'],
        'PENDING_APPROVAL': ['orange', 'Pending Approval'],
        'CANCELLED': ['red', 'Cancelled'],
        'HELD': ['orange', 'On Hold'],
      };
      const [color, label] = map[status] || ['gray', status];
      return `<span class="status-pill ${color}"><span class="dot"></span>${label}</span>`;
    }

    function renderOrders() {
      let list;
      if (orderTab === 'approval') {
        list = STATE.fos.filter(f => f.status === 'PENDING_APPROVAL');
      } else if (orderTab === 'today') {
        list = STATE.fos.filter(f => f.isToday && f.status !== 'PENDING_APPROVAL');
      } else {
        list = STATE.fos.filter(f => f.status !== 'PENDING_APPROVAL');
      }
      const root = document.getElementById('orderList');
      if (!list.length) {
        root.innerHTML = emptyState('orders',
          orderTab === 'approval' ? 'Nothing waiting on you' : 'No orders here yet',
          orderTab === 'approval' ? 'When a request goes above your auto-approval threshold it will land here.' : 'Tap “+ Raise Call-off” to start a new fulfillment order.');
        return;
      }
      root.innerHTML = list.map(fo => renderFoCard(fo)).join('');
    }

    function totalItemCount(fo) {
      return fo.items.reduce((s, i) => s + 1, 0);
    }

    function renderFoCard(fo) {
      const isMR = fo.status === 'PENDING_APPROVAL';
      return `
        <div class="card" onclick="openFo('${fo.id}')">
          <div class="card-row1">
            <span class="card-id">${fo.id}</span>
            ${statusPillFor(fo.status)}
            <span class="prio-chip ${fo.priority.toLowerCase()}">${titleCase(fo.priority)}</span>
          </div>
          <div class="card-project">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            ${fo.projectName}
          </div>
          ${fo.remainderOf ? `<div style="margin-top: 4px;"><span class="remainder-badge">↪ Remainder of ${fo.remainderOf}</span></div>` : ''}
          <div class="card-meta">
            <span>${totalItemCount(fo)} line${totalItemCount(fo) !== 1 ? 's' : ''} · need by <b style="color: var(--text-sub);">${fo.needBy}</b></span>
            <span>${fo.createdAt}</span>
          </div>
          ${isMR ? `
            <div class="card-actions" onclick="event.stopPropagation();">
              <button class="btn btn-natural outlined" onclick="event.stopPropagation(); rejectMr('${fo.id}')">Reject</button>
              <button class="btn btn-primary" onclick="event.stopPropagation(); approveMr('${fo.id}')">Approve</button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function approveMr(id) {
      const fo = STATE.fos.find(f => f.id === id);
      if (!fo) return;
      fo.status = 'NEW';
      fo.isMR = false;
      const newId = 'FO-' + (1010 + Math.floor(Math.random() * 90));
      fo.id = newId;
      fo.activity.push({ who: 'You', when: 'Today, ' + nowTime(), kind: 'Approved', body: 'MR approved → converted to ' + newId });
      showToast(`Approved → ${newId}`);
      renderOrders();
    }
    function rejectMr(id) {
      const fo = STATE.fos.find(f => f.id === id);
      if (!fo) return;
      fo.status = 'CANCELLED';
      fo.activity.push({ who: 'You', when: 'Today, ' + nowTime(), kind: 'Rejected', body: 'MR rejected' });
      showToast('Request rejected', 'warning');
      renderOrders();
    }

    /* ============================================================
       SCREEN 4: FO DETAILS
       ============================================================ */
    let activeFoId = null;

    function openFo(id) {
      activeFoId = id;
      renderFoDetail();
      showScreen('fo-detail');
    }

    function renderFoDetail() {
      const fo = STATE.fos.find(f => f.id === activeFoId);
      if (!fo) return;

      const header = `
        <div class="detail-hdr">
          <div class="detail-hdr-row">
            <span class="detail-hdr-id">${fo.id}</span>
            ${statusPillFor(fo.status)}
            <span class="prio-chip ${fo.priority.toLowerCase()}">${titleCase(fo.priority)}</span>
          </div>
          <div class="detail-hdr-project">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            ${fo.projectName}
          </div>
          ${fo.remainderOf ? `<div class="detail-hdr-remainder"><span class="remainder-badge">↪ Remainder of ${fo.remainderOf}</span></div>` : ''}
        </div>
      `;

      const totalQty = fo.items.reduce((s, i) => s + i.req, 0);
      const itemsBlock = `
        <div style="padding: 0 20px;">
          <div class="items-table">
            <div class="items-table-hdr">
              <div class="items-table-title">Items <span style="color: var(--text-soft); font-weight: 500;">(${fo.items.length})</span></div>
              <div class="items-table-sub">${totalQty} total qty</div>
            </div>
            ${fo.items.map(it => `
              <div class="item-row">
                <div class="item-head">
                  <div style="flex:1;">
                    <div class="item-name">${it.name}</div>
                    <div class="item-sku">SKU ${it.sku}</div>
                  </div>
                </div>
                <div class="item-qty-grid">
                  <div class="item-qty-cell"><div class="item-qty-label">Req</div><div class="item-qty-val">${it.req}</div></div>
                  <div class="item-qty-cell"><div class="item-qty-label">Picked</div><div class="item-qty-val ${it.picked === 0 ? 'pending' : ''}">${it.picked}</div></div>
                  <div class="item-qty-cell"><div class="item-qty-label">Packed</div><div class="item-qty-val ${it.packed === 0 ? 'pending' : ''}">${it.packed}</div></div>
                  <div class="item-qty-cell"><div class="item-qty-label">Delivered</div><div class="item-qty-val ${it.delivered === 0 ? 'pending' : ''}">${it.delivered}</div></div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      const detailsBlock = `
        <div style="padding: 0 20px;">
          <div class="section" id="detSect">
            <div class="section-hdr" onclick="toggleSection('detSect')">
              <div class="sh-left">
                <span class="sh-icon purple">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                </span>
                <span class="sh-title">Details</span>
              </div>
              <div class="sh-right">
                <span class="sh-meta">Source ${fo.source || 'AD_HOC'}</span>
                <svg class="sh-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
            </div>
            <div class="section-body">
              <div class="kv-grid">
                <span class="k">Created by</span><span class="v">${fo.createdBy}</span>
                <span class="k">Created at</span><span class="v">${fo.createdAt}</span>
                <span class="k">Need by</span><span class="v">${fo.needBy}</span>
                <span class="k">Picker</span><span class="v">${fo.picker || '—'}</span>
                <span class="k">Driver</span><span class="v">${fo.driver || '—'}</span>
                ${fo.notes ? `<span class="k">Notes</span><span class="v">${fo.notes}</span>` : ''}
              </div>
            </div>
          </div>

          <div class="section" id="actSect">
            <div class="section-hdr" onclick="toggleSection('actSect')">
              <div class="sh-left">
                <span class="sh-icon blue">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </span>
                <span class="sh-title">Activity</span>
              </div>
              <div class="sh-right">
                <span class="sh-meta">${fo.activity.length} entries</span>
                <svg class="sh-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
            </div>
            <div class="section-body">
              <div class="activity">
                ${fo.activity.slice().reverse().map(a => `
                  <div class="act-item">
                    <span class="act-dot"></span>
                    <span class="act-line"></span>
                    <div class="act-body">
                      <div class="act-meta"><b>${a.who}</b> · ${a.when} · ${a.kind}</div>
                      <div class="act-title">${a.body}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('foDetailBody').innerHTML = header + itemsBlock + detailsBlock;

      // Footer CTA based on status
      const footer = document.getElementById('foFooter');
      const ctas = ctaForStatus(fo);
      footer.innerHTML = ctas;
    }

    function ctaForStatus(fo) {
      const wrap = (html) => `<div style="width:100%; display:flex; gap:8px;">${html}</div>`;
      switch (fo.status) {
        case 'PENDING_APPROVAL':
          return wrap(`
            <button class="btn btn-natural outlined" style="flex:1" onclick="rejectMr('${fo.id}'); goBack();">Reject</button>
            <button class="btn btn-primary" style="flex:1.4" onclick="approveMr('${fo.id}'); renderFoDetail();">Approve</button>
          `);
        case 'NEW':
          return wrap(`<button class="btn btn-primary btn-block" onclick="moveToPick()">Move to Pick</button>`);
        case 'IN_PICK':
          return wrap(`<button class="btn btn-primary btn-block" onclick="openLinkedPick()">Open Pick List</button>`);
        case 'READY':
          return wrap(`<button class="btn btn-primary btn-block" onclick="markDispatched()">Mark as Dispatched</button>`);
        case 'IN_TRANSIT':
          return wrap(`<button class="btn btn-primary btn-block" onclick="openConfirmDelivery()">Confirm Delivery</button>`);
        case 'DELIVERED':
          return wrap(`<button class="btn btn-natural outlined btn-block" onclick="goBack()">Done</button>`);
        case 'CANCELLED':
          return wrap(`<button class="btn btn-natural outlined btn-block" disabled>Cancelled</button>`);
        default:
          return '';
      }
    }

    function moveToPick() {
      const fo = STATE.fos.find(f => f.id === activeFoId);
      fo.status = 'IN_PICK';
      // Create a pick list
      const newPick = {
        id: 'PK-' + (1010 + Math.floor(Math.random() * 90)),
        foId: fo.id,
        project: fo.projectName,
        picker: 'Anup Kulkarni',
        status: 'ASSIGNED',
        items: fo.items.map(it => ({ sku: it.sku, name: it.name, location: '—', need: it.req, picked: 0, flag: null, note: '' })),
      };
      STATE.pickLists.push(newPick);
      fo.pickListId = newPick.id;
      fo.picker = 'Anup Kulkarni';
      fo.activity.push({ who: 'You', when: 'Today, ' + nowTime(), kind: 'Status changed', body: 'NEW → IN_PICK' });
      fo.activity.push({ who: 'You', when: 'Today, ' + nowTime(), kind: 'Picker assigned', body: `Picker Anup Kulkarni assigned to ${newPick.id}` });
      showToast('Moved to Pick · ' + newPick.id + ' created');
      renderFoDetail();
    }

    function openLinkedPick() {
      const fo = STATE.fos.find(f => f.id === activeFoId);
      const pl = STATE.pickLists.find(p => p.foId === fo.id && p.status !== 'DONE');
      if (pl) {
        activePickId = pl.id;
        renderPickDetail();
        showScreen('pick-detail');
      } else {
        showToast('No active pick list', 'warning');
      }
    }

    function markDispatched() {
      const fo = STATE.fos.find(f => f.id === activeFoId);
      fo.status = 'IN_TRANSIT';
      fo.driver = fo.driver || 'Rakesh Patil';
      const shipment = {
        id: 'SH-' + (7020 + Math.floor(Math.random() * 80)),
        foId: fo.id,
        project: fo.projectName,
        driver: fo.driver,
        status: 'IN_TRANSIT',
        dispatchedAt: 'Today · ' + nowTime(),
        deliveredAt: null,
        address: 'Site address on file',
        items: fo.items.map(it => ({ sku: it.sku, name: it.name, qty: it.packed || it.picked || it.req })),
      };
      STATE.shipments.unshift(shipment);
      fo.shipmentId = shipment.id;
      fo.activity.push({ who: 'You', when: 'Today, ' + nowTime(), kind: 'Status changed', body: 'READY → IN_TRANSIT' });
      showToast(`Dispatched · ${shipment.id} created`);
      renderFoDetail();
    }

    function openConfirmDelivery() {
      const fo = STATE.fos.find(f => f.id === activeFoId);
      activeShipmentForDelivery = STATE.shipments.find(s => s.foId === fo.id) || STATE.shipments[0];
      renderDelivery();
      showScreen('delivery');
    }

    function openFoMore() {
      const fo = STATE.fos.find(f => f.id === activeFoId);
      const canAssign = fo.status === 'NEW';
      const rows = [];
      if (canAssign) {
        rows.push(moreItem('Assign picker', fo.picker || 'Not assigned', 'user'));
        rows.push(moreItem('Assign driver', fo.driver || 'Not assigned', 'truck'));
      }
      rows.push(moreItem('Hold order', '', 'pause'));
      rows.push(moreItem('Cancel order', '', 'x', 'error'));
      const body = `
        <div style="display:flex; flex-direction:column; gap:0;">
          ${rows.join('')}
        </div>
      `;
      openSheet('Order actions', body, []);
    }
    function moreItem(label, sub, icon, variant) {
      const color = variant === 'error' ? 'var(--error-base)' : 'var(--text-strong)';
      return `
        <button style="display:flex; align-items:center; justify-content:space-between; padding:14px 0; background:none; border:none; border-bottom: 1px solid var(--stroke-soft); cursor:pointer; width:100%; text-align:left;" onclick="showToast('${label} · prototype'); closeSheet();">
          <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:14px; font-weight:500; color:${color};">${label}</span>
          </div>
          ${sub ? `<span style="font-size:12px; color: var(--text-sub);">${sub}</span>` : ''}
        </button>
      `;
    }

    /* ============================================================
       SCREEN 5: RAISE CALL-OFF
       ============================================================ */
    let coLineItems = [];
    let coPriority = 'standard';

    function openCallOff() {
      // Reset
      coLineItems = [];
      coPriority = 'standard';
      document.getElementById('coProject').value = '';
      document.getElementById('coSerial').innerHTML = '<option value="" disabled selected>Select project first</option>';
      document.getElementById('coSerial').disabled = true;
      document.getElementById('coNeedBy').value = '';
      document.querySelectorAll('#coPriority .prio-opt').forEach(b => b.classList.toggle('active', b.dataset.prio === 'standard'));
      renderLineItems();
      showScreen('calloff');
    }

    function onCoProjectChange() {
      const p = document.getElementById('coProject').value;
      const sel = document.getElementById('coSerial');
      if (!p) { sel.disabled = true; sel.innerHTML = '<option value="" disabled selected>Select project first</option>'; return; }
      sel.disabled = false;
      sel.innerHTML = '<option value="" disabled selected>Select a serial</option>' +
        PROJECT_SERIALS[p].map(s => `<option value="${s.id}">${s.name}</option>`).join('');
      updateCoSubmit();
    }

    function setPriority(p) {
      coPriority = p;
      document.querySelectorAll('#coPriority .prio-opt').forEach(b => b.classList.toggle('active', b.dataset.prio === p));
    }

    function removeLineItem(idx) {
      coLineItems.splice(idx, 1);
      renderLineItems();
    }

    function renderLineItems() {
      const root = document.getElementById('coLineItems');
      if (!coLineItems.length) {
        root.innerHTML = `
          <div class="li-empty">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41L13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            <div class="li-empty-t">No items added yet</div>
            <div class="li-empty-s">Tap “Add item” below to pick a material and quantity.</div>
          </div>`;
      } else {
        root.innerHTML = coLineItems.map((li, idx) => {
          const mat = MATERIALS.find(m => m.id === li.matId);
          const total = (li.qty * li.price);
          return `
            <div class="lineitem-ro">
              <div class="liro-top">
                <div class="liro-name">
                  <span class="liro-idx">${idx + 1}</span>
                  <div>
                    <div class="liro-mat">${mat ? mat.name : '—'}</div>
                    <div class="liro-sku">SKU ${li.matId}</div>
                  </div>
                </div>
                <button class="li-remove" onclick="removeLineItem(${idx})" aria-label="Remove">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
              </div>
              <div class="liro-grid">
                <div class="liro-cell"><span class="liro-k">Qty</span><span class="liro-v">${li.qty} <small>${mat ? mat.uom : ''}</small></span></div>
                <div class="liro-cell"><span class="liro-k">Price / unit</span><span class="liro-v">$${(li.price || 0).toFixed(2)}</span></div>
                <div class="liro-cell liro-cell-total"><span class="liro-k">Total</span><span class="liro-v">$${total.toFixed(2)}</span></div>
              </div>
            </div>
          `;
        }).join('');
      }
      document.getElementById('coLineCount').textContent =
        coLineItems.length + ' item' + (coLineItems.length === 1 ? '' : 's');
      const grand = coLineItems.reduce((s, li) => s + li.qty * li.price, 0);
      document.getElementById('coGrandTotal').textContent = '$' + grand.toFixed(2);
      updateCoSubmit();
    }

    function updateCoSubmit() {
      const proj = document.getElementById('coProject').value;
      const serial = document.getElementById('coSerial').value;
      const valid = proj && serial && coLineItems.some(li => li.matId && li.qty > 0);
      document.getElementById('coSubmitBtn').disabled = !valid;
    }

    /* Add line item bottom sheet */
    let tmpLi = { matId: '', qty: 1, price: 0 };
    function openAddLineSheet() {
      tmpLi = { matId: '', qty: 1, price: 0 };
      const body = `
        <div class="merlin-dropdown" style="margin-bottom: 14px;">
          <label class="input-label">Material <span class="required">*</span></label>
          <div class="input-wrapper">
            <svg class="prefix-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <select id="liMat" onchange="onLiMatChange(this.value)">
              <option value="" disabled selected>Search material…</option>
              ${MATERIALS.map(m => `<option value="${m.id}">${m.name}</option>`).join('')}
            </select>
            <svg class="suffix-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
        <div class="form-row" style="margin-bottom: 14px;">
          <div class="merlin-text-field" style="margin-bottom: 0;">
            <label class="input-label">UoM</label>
            <div class="li-uom" id="liUom" style="height: 44px;">—</div>
          </div>
          <div class="merlin-text-field" style="margin-bottom: 0;">
            <label class="input-label">Quantity <span class="required">*</span></label>
            <div class="qty-stepper" style="width:100%;">
              <button type="button" onclick="adjustLiQty(-1)">−</button>
              <input type="number" id="liQty" value="${tmpLi.qty}" min="0" onchange="setLiQty(this.value)" />
              <button type="button" onclick="adjustLiQty(1)">+</button>
            </div>
          </div>
        </div>
        <div class="merlin-text-field" style="margin-bottom: 0;">
          <label class="input-label">Price / unit</label>
          <div class="input-wrapper">
            <span class="prefix-icon" style="font-weight:600; color: var(--text-sub); display:flex; align-items:center; justify-content:center; width:20px; height:20px;">$</span>
            <input type="number" id="liPrice" min="0" step="0.01" value="0.00" onchange="setLiPrice(this.value)" />
          </div>
        </div>
      `;
      openSheet('Add item', body, [
        { label: 'Cancel', cls: 'btn-natural outlined', onClick: 'closeSheet()' },
        { label: 'Add item', cls: 'btn-primary', onClick: 'saveLineItem()' },
      ]);
    }
    function onLiMatChange(val) {
      tmpLi.matId = val;
      const mat = MATERIALS.find(m => m.id === val);
      if (mat) {
        tmpLi.price = mat.price;
        document.getElementById('liUom').textContent = mat.uom;
        document.getElementById('liPrice').value = mat.price.toFixed(2);
      }
    }
    function setLiQty(val) {
      const n = Math.max(0, parseFloat(val) || 0);
      tmpLi.qty = n;
      document.getElementById('liQty').value = n;
    }
    function adjustLiQty(delta) {
      tmpLi.qty = Math.max(0, (tmpLi.qty || 0) + delta);
      document.getElementById('liQty').value = tmpLi.qty;
    }
    function setLiPrice(val) {
      tmpLi.price = Math.max(0, parseFloat(val) || 0);
    }
    function saveLineItem() {
      if (!tmpLi.matId || !tmpLi.qty) { showToast('Pick a material and qty', 'warning'); return; }
      coLineItems.push({ matId: tmpLi.matId, qty: tmpLi.qty, price: tmpLi.price });
      closeSheet();
      renderLineItems();
      showToast('Item added', 'success');
    }

    function submitCallOff() {
      const proj = document.getElementById('coProject').value;
      const projectName = PROJECT_NAMES[proj] || proj;
      const grand = coLineItems.reduce((s, li) => s + li.qty * li.price, 0);
      const autoApprove = grand <= 500 || coPriority === 'emergency';
      const newId = autoApprove ? ('FO-' + (1020 + Math.floor(Math.random() * 80))) : ('MR-' + (2040 + Math.floor(Math.random() * 80)));
      const newFo = {
        id: newId,
        project: proj,
        projectName,
        status: autoApprove ? 'NEW' : 'PENDING_APPROVAL',
        priority: coPriority.toUpperCase(),
        items: coLineItems.filter(li => li.matId && li.qty > 0).map(li => {
          const m = MATERIALS.find(x => x.id === li.matId);
          return { sku: li.matId, name: m ? m.name : li.matId, req: li.qty, picked: 0, packed: 0, delivered: 0 };
        }),
        source: 'AD_HOC',
        createdBy: 'Sneha Kumari',
        createdAt: 'Today · ' + nowTime(),
        needBy: document.getElementById('coNeedBy').value || 'Tomorrow',
        notes: '',
        isMR: !autoApprove,
        isToday: true,
        activity: [
          { who: 'You', when: 'Today, ' + nowTime(), kind: autoApprove ? 'Created' : 'Submitted', body: autoApprove ? 'Ad-Hoc Call-off created (auto-approved)' : 'Awaiting PM approval ($' + grand.toFixed(2) + ')' },
        ],
      };
      STATE.fos.unshift(newFo);
      showToast(autoApprove ? `FO created · ${newId}` : `Submitted · ${newId} pending approval`, autoApprove ? 'success' : 'info');
      // Land back on Orders with the right tab
      if (!autoApprove) orderTab = 'approval';
      else orderTab = 'today';
      navStack.length = 0;
      navStack.push('orders');
      showScreen('orders');
    }

    /* ============================================================
       SCREEN 6: CONFIRM DELIVERY
       ============================================================ */
    let activeShipmentForDelivery = null;
    let deliveryLines = []; // [{ sku, name, qty, status: 'received'|'issue'|null, issueType, note }]

    function renderDelivery() {
      const fo = STATE.fos.find(f => f.id === activeFoId);
      const sh = activeShipmentForDelivery;
      if (!fo || !sh) return;
      document.getElementById('cdSub').textContent = `${sh.id} · ${fo.id}`;
      // Seed lines once per delivery
      if (!deliveryLines.length || deliveryLines._foId !== fo.id) {
        deliveryLines = fo.items.map(it => ({ sku: it.sku, name: it.name, qty: it.packed || it.req, status: null, issueType: '', note: '' }));
        deliveryLines._foId = fo.id;
      }
      const body = `
        <div class="items-table" style="margin-bottom: 14px;">
          <div class="items-table-hdr">
            <div>
              <div class="items-table-title">${sh.id}</div>
              <div class="items-table-sub">${fo.projectName} · Driver ${sh.driver || '—'}</div>
            </div>
            ${statusPillFor('IN_TRANSIT')}
          </div>
          <div style="padding: 12px 14px;">
            <div class="kv-grid">
              <span class="k">FO</span><span class="v">${fo.id}</span>
              <span class="k">Drop address</span><span class="v">${sh.address || '—'}</span>
              <span class="k">Dispatched</span><span class="v">${sh.dispatchedAt}</span>
            </div>
          </div>
        </div>

        <div style="font-size: 12px; color: var(--text-sub); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px;">Items received</div>
        ${deliveryLines.map((d, idx) => renderDeliveryLine(d, idx)).join('')}

        <div style="font-size: 12px; color: var(--text-sub); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; margin: 18px 0 8px;">Signature</div>
        <div class="sig-pad-wrap" id="sigPadWrap">
          <canvas id="sigCanvas"></canvas>
          <span class="sig-placeholder">Tap and drag to sign</span>
        </div>
        <div class="sig-actions">
          <span class="sig-stamp" id="sigStamp">Not signed yet</span>
          <button class="sig-clear" onclick="clearSignature()">Clear</button>
        </div>

        <div class="merlin-text-field" style="margin-top: 18px; margin-bottom: 0;">
          <label class="input-label">Note <span class="optional">optional</span></label>
          <div class="input-wrapper multiline">
            <textarea id="cdNote" placeholder="Any general comments for this delivery"></textarea>
          </div>
        </div>
      `;
      document.getElementById('deliveryBody').innerHTML = body;
      initSignature();
      updateConfirmBtn();
    }

    function renderDeliveryLine(d, idx) {
      const issueTypes = ['Damaged', 'Missing', 'Loss', 'Wrong Item', 'Over Delivery', 'Substitution'];
      const cls = d.status === 'received' ? 'received' : d.status === 'issue' ? 'issue' : '';
      return `
        <div class="deliv-item ${cls}">
          <div class="di-head">
            <div class="di-info">
              <div class="di-name">${d.name}</div>
              <div class="di-qty">SKU ${d.sku} · ${d.qty} units</div>
            </div>
            <div class="di-status-seg">
              <button class="received ${d.status === 'received' ? 'active' : ''}" onclick="setDeliveryStatus(${idx}, 'received')">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> OK
              </button>
              <button class="issue ${d.status === 'issue' ? 'active' : ''}" onclick="setDeliveryStatus(${idx}, 'issue')">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Issue
              </button>
            </div>
          </div>
          <div class="di-issue-detail">
            <div class="merlin-dropdown" style="margin-bottom: 8px;">
              <label class="input-label">Issue type</label>
              <div class="input-wrapper">
                <select onchange="setIssueType(${idx}, this.value)">
                  <option value="" ${!d.issueType ? 'selected' : ''} disabled>Select</option>
                  ${issueTypes.map(t => `<option value="${t}" ${d.issueType === t ? 'selected' : ''}>${t}</option>`).join('')}
                </select>
                <svg class="suffix-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
            </div>
            <div class="merlin-text-field" style="margin-bottom: 0;">
              <label class="input-label">Note</label>
              <div class="input-wrapper multiline">
                <textarea placeholder="Describe the issue" oninput="setIssueNote(${idx}, this.value)">${d.note || ''}</textarea>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function setDeliveryStatus(idx, status) {
      deliveryLines[idx].status = status;
      renderDelivery();
    }
    function setIssueType(idx, t) {
      deliveryLines[idx].issueType = t;
      updateConfirmBtn();
    }
    function setIssueNote(idx, n) {
      deliveryLines[idx].note = n;
      updateConfirmBtn();
    }
    function updateConfirmBtn() {
      const allSet = deliveryLines.every(d => d.status);
      const issuesValid = deliveryLines.filter(d => d.status === 'issue').every(d => d.issueType);
      const allReceived = deliveryLines.every(d => d.status === 'received');
      const sigOk = allReceived ? sigHasInk : true;
      document.getElementById('cdConfirmBtn').disabled = !(allSet && issuesValid && sigOk);
    }

    function submitDelivery() {
      const fo = STATE.fos.find(f => f.id === activeFoId);
      const sh = activeShipmentForDelivery;
      if (!fo || !sh) return;
      fo.status = 'DELIVERED';
      fo.items.forEach(it => { it.delivered = it.packed || it.req; });
      sh.status = 'DELIVERED';
      sh.deliveredAt = 'Today · ' + nowTime();
      const issueCount = deliveryLines.filter(d => d.status === 'issue').length;
      fo.activity.push({ who: 'You', when: 'Today, ' + nowTime(), kind: 'Status changed', body: 'IN_TRANSIT → DELIVERED' });
      if (issueCount) fo.activity.push({ who: 'You', when: 'Today, ' + nowTime(), kind: 'Delivery issues', body: `${issueCount} item${issueCount > 1 ? 's' : ''} flagged at receipt` });
      deliveryLines = [];
      showToast(issueCount ? `Delivered · ${issueCount} issue${issueCount > 1 ? 's' : ''} flagged` : 'Delivery confirmed', issueCount ? 'warning' : 'success');
      goBack();
      renderFoDetail();
    }

    /* ============================================================
       SCREEN 7: SHIPMENTS
       ============================================================ */
    function renderShipments() {
      const list = STATE.shipments;
      document.getElementById('shipHdrSub').textContent = `${list.length} shipment${list.length !== 1 ? 's' : ''}`;
      const root = document.getElementById('shipmentList');
      if (!list.length) {
        root.innerHTML = emptyState('shipments', 'No shipments yet', 'When an order is dispatched, a shipment record appears here.');
        return;
      }
      root.innerHTML = list.map(sh => {
        const totalQty = sh.items.reduce((s, i) => s + i.qty, 0);
        const statusCfg = {
          'LOADED': ['gray', 'Loaded'],
          'IN_TRANSIT': ['feature', 'In Transit'],
          'DELIVERED': ['green', 'Delivered'],
        }[sh.status] || ['gray', sh.status];
        return `
          <div class="card" onclick="openShipmentSheet('${sh.id}')">
            <div class="card-row1">
              <span class="card-id">${sh.id}</span>
              <span style="color: var(--text-soft);">·</span>
              <span class="card-sub-id">${sh.foId}</span>
              <span style="flex:1"></span>
              <span class="status-pill ${statusCfg[0]}"><span class="dot"></span>${statusCfg[1]}</span>
            </div>
            <div class="card-project">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Driver: <span style="color: var(--text-strong); font-weight: 500;">${sh.driver}</span>
              <span style="color: var(--text-soft);">·</span>
              ${sh.items.length} item${sh.items.length !== 1 ? 's' : ''} (${totalQty} qty)
            </div>
            <div class="ship-meta-row">
              <div class="ship-meta-cell">
                <div class="k">Dispatched</div>
                <div class="v">${sh.dispatchedAt}</div>
              </div>
              <div class="ship-meta-cell">
                <div class="k">Delivered</div>
                <div class="v" style="${!sh.deliveredAt ? 'color: var(--text-soft); font-weight: 400;' : ''}">${sh.deliveredAt || 'In transit'}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openShipmentSheet(id) {
      const sh = STATE.shipments.find(s => s.id === id);
      if (!sh) return;
      const fo = STATE.fos.find(f => f.id === sh.foId);
      const statusCfg = {
        'LOADED': ['gray', 'Loaded'],
        'IN_TRANSIT': ['feature', 'In Transit'],
        'DELIVERED': ['green', 'Delivered'],
      }[sh.status] || ['gray', sh.status];
      const body = `
        <div style="display:flex; align-items:center; gap:8px; margin-bottom: 12px;">
          <span class="status-pill ${statusCfg[0]}"><span class="dot"></span>${statusCfg[1]}</span>
          <span style="color: var(--text-soft); font-size: 12px;">Linked to ${sh.foId}</span>
        </div>
        <div class="kv-grid" style="margin-bottom: 16px;">
          <span class="k">Project</span><span class="v">${sh.project}</span>
          <span class="k">Driver</span><span class="v">${sh.driver}</span>
          <span class="k">Address</span><span class="v">${sh.address}</span>
          <span class="k">Dispatched</span><span class="v">${sh.dispatchedAt}</span>
          <span class="k">Delivered</span><span class="v">${sh.deliveredAt || '—'}</span>
        </div>
        <div style="font-size: 12px; color: var(--text-sub); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px;">Items</div>
        <div class="items-table" style="margin-bottom: 0;">
          ${sh.items.map(it => `
            <div class="item-row" style="padding: 10px 14px;">
              <div style="display:flex; align-items:center; justify-content:space-between; gap: 10px;">
                <div style="flex:1; min-width:0;">
                  <div class="item-name">${it.name}</div>
                  <div class="item-sku">SKU ${it.sku}</div>
                </div>
                <div style="font-size: 14px; font-weight: 700; color: var(--text-strong);">${it.qty}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
      openSheet(sh.id, body, fo ? [
        { label: 'Open FO', cls: 'btn-primary btn-block', onClick: `openFoFromSheet('${fo.id}')` },
      ] : []);
    }
    function openFoFromSheet(id) {
      closeSheet();
      openFo(id);
    }

    /* ============================================================
       SHEET + TOAST + COMMON UI
       ============================================================ */
    function openSheet(title, body, actions = []) {
      document.getElementById('sheetTitle').textContent = title;
      document.getElementById('sheetBody').innerHTML = body;
      const ft = document.getElementById('sheetFooter');
      if (actions && actions.length) {
        ft.style.display = 'flex';
        ft.innerHTML = actions.map(a => `<button class="btn ${a.cls}" style="flex:1" onclick="${a.onClick}">${a.label}</button>`).join('');
      } else {
        ft.style.display = 'none';
        ft.innerHTML = '';
      }
      document.getElementById('scrim').classList.add('show');
      document.getElementById('sheet').classList.add('show');
    }
    function closeSheet() {
      document.getElementById('scrim').classList.remove('show');
      document.getElementById('sheet').classList.remove('show');
    }

    let toastTimer;
    function showToast(msg, type) {
      const t = document.getElementById('toast');
      const icon = document.getElementById('toastIcon');
      t.classList.remove('warning', 'info');
      if (type === 'warning') {
        t.classList.add('warning');
        icon.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
      } else if (type === 'info') {
        t.classList.add('info');
        icon.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
      } else {
        icon.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      }
      document.getElementById('toastMsg').textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
    }

    function toggleSection(id) {
      document.getElementById(id).classList.toggle('collapsed');
    }

    function emptyState(kind, title, sub) {
      const icons = {
        picks: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
        orders: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>',
        shipments: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',
      };
      return `
        <div class="empty-state">
          <div class="empty-illus">${icons[kind] || ''}</div>
          <div class="empty-title">${title}</div>
          <div class="empty-sub">${sub}</div>
        </div>
      `;
    }

    function titleCase(s) {
      if (!s) return '';
      return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
    }

    function nowTime() {
      const d = new Date();
      const h = ((d.getHours() + 11) % 12 + 1);
      const m = String(d.getMinutes()).padStart(2, '0');
      const ap = d.getHours() >= 12 ? 'PM' : 'AM';
      return `${h}:${m} ${ap}`;
    }

    /* ============================================================
       SIGNATURE CANVAS
       ============================================================ */
    let sigCanvas, sigCtx, sigDrawing = false, sigHasInk = false;
    function initSignature() {
      sigCanvas = document.getElementById('sigCanvas');
      if (!sigCanvas) return;
      sigHasInk = false;
      const ratio = window.devicePixelRatio || 1;
      const W = 318, H = 140;
      sigCanvas.width = W * ratio;
      sigCanvas.height = H * ratio;
      sigCanvas.style.width = '100%';
      sigCanvas.style.height = '100%';
      sigCtx = sigCanvas.getContext('2d');
      sigCtx.scale(ratio, ratio);
      sigCtx.strokeStyle = '#1A1A1A';
      sigCtx.lineWidth = 2;
      sigCtx.lineCap = 'round';
      sigCtx.lineJoin = 'round';
      sigCanvas.addEventListener('mousedown', sigStart);
      sigCanvas.addEventListener('mousemove', sigMove);
      window.addEventListener('mouseup', sigEnd);
      sigCanvas.addEventListener('touchstart', sigStart, { passive: false });
      sigCanvas.addEventListener('touchmove', sigMove, { passive: false });
      sigCanvas.addEventListener('touchend', sigEnd);
    }
    function sigPointer(e) {
      const r = sigCanvas.getBoundingClientRect();
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top };
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    function sigStart(e) {
      e.preventDefault();
      if (!sigCtx) return;
      sigDrawing = true;
      const p = sigPointer(e);
      sigCtx.beginPath();
      sigCtx.moveTo(p.x, p.y);
    }
    function sigMove(e) {
      if (!sigDrawing) return;
      e.preventDefault();
      const p = sigPointer(e);
      sigCtx.lineTo(p.x, p.y);
      sigCtx.stroke();
      sigHasInk = true;
    }
    function sigEnd() {
      if (!sigDrawing) return;
      sigDrawing = false;
      if (sigHasInk) {
        document.getElementById('sigPadWrap').classList.add('signed');
        document.getElementById('sigStamp').textContent = 'Signed at ' + nowTime();
        document.getElementById('sigStamp').classList.add('signed');
      }
      updateConfirmBtn();
    }
    function clearSignature() {
      if (!sigCtx || !sigCanvas) return;
      sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
      sigHasInk = false;
      document.getElementById('sigPadWrap').classList.remove('signed');
      document.getElementById('sigStamp').textContent = 'Not signed yet';
      document.getElementById('sigStamp').classList.remove('signed');
      updateConfirmBtn();
    }

    /* ============================================================
       INIT
       ============================================================ */
    renderPicks();
    renderOrders();
    renderShipments();
  </script>
</body>
</html>
