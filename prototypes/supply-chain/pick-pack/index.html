<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pick & Pack - MerlinAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-dark: #2A1731;
      --primary-darker: #3B1F46;
      --primary-base: #5D2F70;
      --secondary-base: #FDDC8D;
      --bg-strong: #171717;
      --bg-surface: #262626;
      --bg-soft: #EBEBEB;
      --bg-weak: #F7F7F7;
      --bg-canvas: #FAFAFB;
      --bg-white: #FFFFFF;
      --text-strong: #171717;
      --text-sub: #5C5C5C;
      --text-soft: #A3A3A3;
      --text-disabled: #D1D1D1;
      --stroke-strong: #171717;
      --stroke-sub: #D1D1D1;
      --stroke-soft: #EBEBEB;
      --success-dark: #0B4627;
      --success-base: #1FC16B;
      --success-light: #C2F5DA;
      --success-lighter: #E0FAEC;
      --warning-dark: #71330A;
      --warning-base: #FA7319;
      --warning-light: #FFD9C0;
      --warning-lighter: #FFF3EB;
      --error-dark: #681219;
      --error-base: #FB3748;
      --error-light: #FFC0C5;
      --error-lighter: #FFEBEC;
      --info-base: #5D2F70;
      --info-light: #E1D3F0;
      --info-lighter: #F6F1FA;
      --sky-base: #47C2FF;
      --sky-light: #C0EAFF;
      --sky-lighter: #EBF8FF;
      --yellow-base: #F6B51E;
      --yellow-light: #FFECC0;
      --yellow-lighter: #FFFAEB;
      --purple-base: #7D52F4;
      --purple-lighter: #EFEBFF;
      --pink-base: #FB4BA3;
      --pink-lighter: #FFEBF4;
      --teal-base: #22D3BB;
      --teal-lighter: #E4FBF8;
      --brand-50: #F6F1FA;
      --brand-100: #E1D3F0;
      --brand-200: #BC9FD3;
      --brand-400: #6E3785;
      --brand-800: #2A1731;
      --brand-950: #1B101E;
      --golden-500: #FDDC8D;
      --golden-600: #E9B669;
      --font-family: 'Inter', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      color: var(--text-strong);
      background: var(--brand-950);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    /* Phone frame (desktop only) */
    .phone-frame {
      width: 390px;
      height: 844px;
      background: var(--bg-white);
      border-radius: 48px;
      box-shadow: 0 0 0 2px #0D0D0D, 0 0 0 7px #2A2A2A, 0 0 0 9px #0D0D0D, 0 50px 100px rgba(0,0,0,0.5), 0 20px 40px rgba(93,47,112,0.15);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 36px;
      background: #000;
      border-radius: 20px;
      z-index: 100;
    }
    .status-bar {
      height: 54px;
      padding: 14px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 2;
      background: var(--bg-white);
    }
    .status-time { font-size: 15px; font-weight: 600; color: var(--text-strong); }
    .status-icons { display: flex; align-items: center; gap: 6px; }
    .status-icons svg { width: 18px; height: 12px; fill: var(--text-strong); }
    .home-ind {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: var(--bg-white);
    }
    .home-ind-bar {
      width: 130px;
      height: 5px;
      background: #000;
      border-radius: 100px;
    }

    @media (max-width: 430px) {
      body { background: var(--bg-white); padding: 0; display: block; }
      .phone-frame { width: 100%; height: 100vh; border-radius: 0; box-shadow: none; }
      .dynamic-island { display: none; }
      .status-bar { display: none !important; }
      .home-ind { display: none !important; }
    }

    /* Screens */
    .screen { display: none; flex-direction: column; height: 100%; overflow: hidden; }
    .screen.active { display: flex; }

    /* Top bar */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 20px 12px;
      background: var(--bg-white);
      flex-shrink: 0;
    }
    .top-bar-back, .top-bar-action {
      width: 36px; height: 36px;
      border-radius: 10px;
      border: 1px solid var(--stroke-soft);
      background: var(--bg-white);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-sub);
      flex-shrink: 0;
      transition: background 0.12s;
    }
    .top-bar-back:active, .top-bar-action:active { background: var(--bg-weak); }
    .top-bar-title {
      font-size: 18px; font-weight: 600; color: var(--text-strong);
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .top-bar-sub {
      font-size: 11px; font-weight: 400; color: var(--text-soft);
      margin-top: 1px;
    }
    .top-bar-title-wrap { flex: 1; min-width: 0; }

    /* Segmented control */
    .seg-wrap { padding: 0 20px 12px; background: var(--bg-white); flex-shrink: 0; }
    .seg {
      display: grid;
      gap: 4px; padding: 4px;
      background: var(--bg-weak); border-radius: 10px;
    }
    .seg.cols-2 { grid-template-columns: 1fr 1fr; }
    .seg.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .seg.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .seg .seg-opt {
      height: 36px; border-radius: 7px;
      background: transparent; border: none; cursor: pointer;
      font-family: var(--font-family); font-size: 12px; font-weight: 500;
      color: var(--text-sub);
      display: flex; align-items: center; justify-content: center; gap: 4px;
      transition: all 0.15s;
      position: relative;
      white-space: nowrap;
    }
    .seg .seg-opt.active {
      background: var(--bg-white);
      color: var(--text-strong);
      box-shadow: 0 1px 2px rgba(17,17,17,0.04), 0 2px 6px rgba(17,17,17,0.06);
      font-weight: 600;
    }
    .seg .seg-opt .count {
      font-size: 10px; padding: 1px 5px;
      background: var(--info-lighter); color: var(--primary-base);
      border-radius: 8px; font-weight: 600;
    }
    .seg .seg-opt.active .count { background: var(--brand-100); }

    /* Scrollable body */
    .scroll-area {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding-bottom: 0;
    }
    .scroll-content { padding: 4px 20px 24px; }
    .scroll-content.with-footer { padding-bottom: 96px; }
    .scroll-content.with-tabbar { padding-bottom: 80px; }

    /* Bottom tab bar (root screens only) */
    .bottom-tab-bar {
      position: absolute;
      left: 0; right: 0; bottom: 28px;
      height: 68px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: saturate(140%) blur(12px);
      -webkit-backdrop-filter: saturate(140%) blur(12px);
      border-top: 1px solid var(--stroke-soft);
      display: flex;
      align-items: stretch;
      z-index: 8;
      padding: 4px 0 0;
    }
    .bottom-tab-bar .tab {
      position: relative;
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4px;
      background: none; border: none;
      cursor: pointer;
      font-family: var(--font-family);
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.1px;
      color: var(--text-soft);
      transition: color 0.12s;
      padding: 8px 4px 4px;
    }
    .bottom-tab-bar .tab svg { width: 22px; height: 22px; transition: transform 0.18s ease-out; }
    .bottom-tab-bar .tab.active { color: var(--primary-base); }
    .bottom-tab-bar .tab.active svg { transform: translateY(-1px); }
    .bottom-tab-bar .tab.active::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 28px; height: 3px;
      border-radius: 0 0 3px 3px;
      background: linear-gradient(90deg, #6E3785, #5D2F70);
    }
    .bottom-tab-bar .tab .badge-dot {
      position: absolute;
      transform: translate(10px, -8px);
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--error-base);
      border: 2px solid var(--bg-white);
    }

    /* FAB */
    .fab {
      position: absolute;
      right: 16px; bottom: 108px;
      height: 52px;
      padding: 0 20px 0 16px;
      border-radius: 26px;
      background: linear-gradient(135deg, #6E3785 0%, #5D2F70 60%, #4C285B 100%);
      color: #fff;
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-family); font-size: 14px; font-weight: 600;
      letter-spacing: -0.1px;
      border: none; cursor: pointer;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.12) inset,
        0 12px 28px rgba(93,47,112,0.4),
        0 4px 10px rgba(93,47,112,0.25);
      z-index: 7;
      transition: transform 0.12s, box-shadow 0.15s;
    }
    .fab:active { transform: scale(0.96); box-shadow: 0 6px 16px rgba(93,47,112,0.35); }
    .fab svg { width: 18px; height: 18px; }

    /* Sticky footer button bar */
    .footer-bar {
      position: absolute;
      left: 0; right: 0; bottom: 28px;
      padding: 12px 20px;
      background: linear-gradient(to top, var(--bg-white) 60%, rgba(255,255,255,0));
      pointer-events: none;
      z-index: 5;
      display: flex;
      gap: 10px;
    }
    .footer-bar .btn { pointer-events: auto; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 44px; padding: 0 16px;
      border: 1px solid transparent; border-radius: 8px;
      font-family: var(--font-family);
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      transition: all 0.12s;
      background: var(--bg-white);
      color: var(--text-strong);
    }
    .btn:active { transform: scale(0.985); }
    .btn-md { height: 44px; }
    .btn-sm { height: 40px; font-size: 13px; }
    .btn-xs { height: 36px; padding: 0 12px; font-size: 12px; }
    .btn-block { width: 100%; }

    .btn-primary {
      background: linear-gradient(135deg, #6E3785 0%, #5D2F70 60%, #4C285B 100%);
      color: #fff;
      border-color: var(--primary-base);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.12) inset,
        0 6px 14px rgba(93,47,112,0.28),
        0 2px 4px rgba(93,47,112,0.18);
      letter-spacing: -0.1px;
    }
    .btn-primary.outlined {
      background: transparent; color: var(--primary-base);
      box-shadow: none;
    }
    .btn-natural {
      background: var(--bg-white); color: var(--text-sub);
      border-color: var(--stroke-sub);
    }
    .btn-natural.outlined { background: transparent; }
    .btn-error {
      background: var(--error-base); color: #fff;
      border-color: var(--error-base);
    }
    .btn-error.outlined {
      background: transparent; color: var(--error-base);
    }
    .btn-warning.outlined {
      background: var(--warning-lighter); color: var(--warning-dark);
      border-color: var(--warning-light);
    }
    .btn-success {
      background: var(--success-base); color: #fff;
      border-color: var(--success-base);
    }
    .btn:disabled {
      background: var(--bg-soft); color: var(--text-disabled);
      border-color: var(--bg-soft); box-shadow: none; cursor: not-allowed;
    }

    /* Status pills (FO status) */
    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 9px 3px 8px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
      letter-spacing: -0.1px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .status-pill.gray { background: var(--bg-weak); color: var(--text-sub); }
    .status-pill.gray .dot { background: var(--text-soft); }
    .status-pill.blue { background: var(--sky-lighter); color: #124B68; }
    .status-pill.blue .dot { background: var(--sky-base); box-shadow: 0 0 0 3px rgba(71,194,255,0.18); }
    .status-pill.purple { background: var(--info-lighter); color: var(--primary-base); }
    .status-pill.purple .dot { background: var(--primary-base); box-shadow: 0 0 0 3px rgba(93,47,112,0.16); }
    .status-pill.green { background: var(--success-lighter); color: var(--success-dark); }
    .status-pill.green .dot { background: var(--success-base); box-shadow: 0 0 0 3px rgba(31,193,107,0.2); }
    .status-pill.orange { background: var(--warning-lighter); color: var(--warning-dark); }
    .status-pill.orange .dot { background: var(--warning-base); box-shadow: 0 0 0 3px rgba(250,115,25,0.18); }
    .status-pill.red { background: var(--error-lighter); color: var(--error-dark); }
    .status-pill.red .dot { background: var(--error-base); box-shadow: 0 0 0 3px rgba(251,55,72,0.18); }
    .status-pill.feature { background: var(--purple-lighter); color: #4C25A7; }
    .status-pill.feature .dot { background: var(--purple-base); box-shadow: 0 0 0 3px rgba(125,82,244,0.18); }

    /* Priority chip (STANDARD / RUSH / EMERGENCY) */
    .prio-chip {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: 4px;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.6px;
      flex-shrink: 0;
      text-transform: uppercase;
      border: 1px solid transparent;
    }
    .prio-chip.standard { background: var(--bg-weak); color: var(--text-sub); border-color: var(--stroke-soft); }
    .prio-chip.rush { background: var(--yellow-lighter); color: #86661D; border-color: rgba(246,181,30,0.25); }
    .prio-chip.emergency { background: var(--error-lighter); color: var(--error-dark); border-color: rgba(251,55,72,0.2); }

    /* Cards (FO / Pick / Shipment) */
    .card {
      background: var(--bg-white);
      border: 1px solid var(--stroke-soft);
      border-radius: 14px;
      padding: 14px 14px 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 1px 2px rgba(17,17,17,0.03), 0 2px 6px rgba(17,17,17,0.025);
    }
    .card:hover { border-color: var(--stroke-sub); box-shadow: 0 2px 4px rgba(17,17,17,0.04), 0 6px 14px rgba(93,47,112,0.06); }
    .card:active { transform: scale(0.99); background: var(--bg-weak); }
    .card-row1 {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .card-id {
      font-size: 14px; font-weight: 700; color: var(--text-strong);
      letter-spacing: -0.2px;
    }
    .card-sub-id {
      font-size: 12px; color: var(--text-sub); font-weight: 500;
    }
    .card-project {
      font-size: 12px; color: var(--text-sub);
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 4px;
    }
    .card-project svg { width: 13px; height: 13px; color: var(--text-soft); flex-shrink: 0; }
    .card-meta {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      font-size: 11px; color: var(--text-soft);
      margin-top: 4px;
    }
    .card-meta .person {
      display: flex; align-items: center; gap: 4px;
    }
    .card-meta .person svg { width: 12px; height: 12px; }
    .card-divider {
      height: 1px; background: var(--stroke-soft);
      margin: 10px 0 8px;
    }

    /* Progress bar */
    .progress {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
    }
    .progress-text {
      font-size: 11px; color: var(--text-sub); font-weight: 500;
      flex-shrink: 0;
    }
    .progress-bar {
      flex: 1; height: 5px;
      background: var(--bg-soft); border-radius: 3px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--success-base);
      border-radius: 3px; transition: width 0.3s;
    }
    .progress-fill.warning { background: var(--warning-base); }
    .progress-pct {
      font-size: 11px; color: var(--text-sub); font-weight: 600;
      flex-shrink: 0; min-width: 28px; text-align: right;
    }

    /* Inline approve/reject for MR cards */
    .card-actions {
      display: flex; gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--stroke-soft);
    }
    .card-actions .btn { flex: 1; height: 36px; font-size: 12px; }

    /* Sections (collapsible) */
    .section {
      margin-bottom: 10px;
      border: 1px solid var(--stroke-soft);
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg-white);
      box-shadow: 0 1px 2px rgba(17,17,17,0.03);
    }
    .section-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px;
      cursor: pointer; user-select: none;
    }
    .section-hdr:active { background: var(--bg-weak); }
    .sh-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .sh-icon {
      width: 28px; height: 28px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .sh-icon.purple { background: var(--info-lighter); color: var(--primary-base); }
    .sh-icon.blue { background: var(--sky-lighter); color: #1F7EAD; }
    .sh-icon.gray { background: var(--bg-weak); color: var(--text-sub); }
    .sh-title { font-size: 13px; font-weight: 600; color: var(--text-strong); }
    .sh-right { display: flex; align-items: center; gap: 8px; color: var(--text-soft); }
    .sh-meta { font-size: 11px; color: var(--text-soft); }
    .sh-chev { transition: transform 0.2s; flex-shrink: 0; }
    .section.collapsed .sh-chev { transform: rotate(-90deg); }
    .section-body {
      padding: 12px 14px 14px;
      border-top: 1px solid var(--stroke-soft);
    }
    .section.collapsed .section-body { display: none; }

    /* Key-value grid in section bodies */
    .kv-grid {
      display: grid; grid-template-columns: auto 1fr;
      gap: 6px 12px;
    }
    .kv-grid .k {
      font-size: 11px; color: var(--text-soft);
      text-transform: uppercase; letter-spacing: 0.4px;
      font-weight: 500;
    }
    .kv-grid .v {
      font-size: 13px; color: var(--text-strong); font-weight: 500;
    }

    /* Items table (FO Details, Confirm Delivery) */
    .items-table {
      border: 1px solid var(--stroke-soft);
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg-white);
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(17,17,17,0.03);
    }
    .items-table-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px;
      background: var(--bg-weak);
      border-bottom: 1px solid var(--stroke-soft);
    }
    .items-table-title { font-size: 13px; font-weight: 600; color: var(--text-strong); }
    .items-table-sub { font-size: 11px; color: var(--text-sub); }
    .item-row {
      padding: 12px 14px;
      border-bottom: 1px solid var(--stroke-soft);
      display: flex; flex-direction: column; gap: 8px;
    }
    .item-row:last-child { border-bottom: none; }
    .item-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 10px;
    }
    .item-name {
      font-size: 13px; font-weight: 500; color: var(--text-strong);
      line-height: 1.4;
    }
    .item-sku {
      font-size: 11px; color: var(--text-soft);
      margin-top: 2px;
    }
    .item-qty-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px dashed var(--stroke-soft);
    }
    .item-qty-cell {
      display: flex; flex-direction: column; align-items: center;
      gap: 1px;
    }
    .item-qty-label {
      font-size: 9px; color: var(--text-soft);
      text-transform: uppercase; letter-spacing: 0.4px;
      font-weight: 600;
    }
    .item-qty-val {
      font-size: 14px; font-weight: 600; color: var(--text-strong);
    }
    .item-qty-val.pending { color: var(--text-soft); }

    /* Quantity stepper */
    .qty-stepper {
      display: inline-flex; align-items: center;
      border: 1px solid var(--stroke-soft);
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg-white);
      height: 38px;
      box-shadow: 0 1px 2px rgba(17,17,17,0.04);
    }
    .qty-stepper button {
      width: 34px; height: 100%;
      border: none; background: var(--bg-white);
      color: var(--primary-base);
      font-family: var(--font-family); font-size: 18px; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s;
    }
    .qty-stepper button:active { background: var(--brand-50); }
    .qty-stepper button:disabled { color: var(--text-disabled); cursor: not-allowed; background: var(--bg-weak); }
    .qty-stepper input {
      width: 52px; height: 100%;
      border: none; border-left: 1px solid var(--stroke-soft);
      border-right: 1px solid var(--stroke-soft);
      text-align: center;
      font-family: var(--font-family); font-size: 14px; font-weight: 700;
      color: var(--text-strong);
      outline: none;
      background: var(--bg-white);
      letter-spacing: -0.2px;
    }
    .qty-stepper input:focus { background: var(--brand-50); }

    /* Pick-line row (S2) */
    .pick-line {
      padding: 12px 14px;
      border-bottom: 1px solid var(--stroke-soft);
    }
    .pick-line:last-child { border-bottom: none; }
    .pick-line.flagged { background: var(--error-lighter); }
    .pick-line.done { background: var(--success-lighter); }
    .pl-head {
      display: flex; gap: 10px;
      margin-bottom: 8px;
    }
    .pl-num {
      width: 24px; height: 24px;
      border-radius: 6px;
      background: var(--info-lighter); color: var(--primary-base);
      font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .pick-line.done .pl-num { background: var(--success-base); color: #fff; }
    .pick-line.flagged .pl-num { background: var(--error-base); color: #fff; }
    .pl-info { flex: 1; min-width: 0; }
    .pl-name { font-size: 13px; font-weight: 500; color: var(--text-strong); line-height: 1.35; }
    .pl-sku { font-size: 11px; color: var(--text-soft); margin-top: 2px; }
    .pl-meta {
      display: flex; gap: 12px;
      font-size: 11px; color: var(--text-sub);
      margin-top: 6px;
    }
    .pl-meta strong { color: var(--text-strong); font-weight: 600; }
    .pl-actions {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
    }
    .pl-flag-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 10px; border-radius: 6px;
      background: var(--bg-weak); color: var(--text-sub);
      border: 1px solid var(--stroke-soft);
      font-family: var(--font-family); font-size: 11px; font-weight: 500;
      cursor: pointer; transition: all 0.12s;
    }
    .pl-flag-btn:active { background: var(--warning-lighter); color: var(--warning-dark); }
    .pl-flag-btn.active {
      background: var(--error-lighter); color: var(--error-dark);
      border-color: var(--error-light);
    }
    .pl-exception-note {
      padding: 8px 10px;
      background: var(--bg-white); border: 1px dashed var(--error-light);
      border-radius: 6px;
      font-size: 11px; color: var(--error-dark);
      margin-top: 6px;
    }
    .pl-actions-ro {
      padding: 8px 12px;
      background: var(--bg-white);
      border: 1px solid var(--stroke-soft);
      border-radius: 10px;
    }
    .pl-ro-summary { display: flex; align-items: baseline; gap: 8px; }
    .pl-ro-label {
      font-size: 10px; color: var(--text-soft);
      text-transform: uppercase; letter-spacing: 0.4px;
      font-weight: 600;
    }
    .pl-ro-value { font-size: 16px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.3px; }
    .pl-ro-of { font-size: 12px; font-weight: 500; color: var(--text-soft); margin-left: 2px; }
    .pl-ro-check {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 500;
      color: var(--text-soft);
    }
    .pl-ro-check svg { color: var(--success-base); }
    .pl-ro-flag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 6px;
      background: var(--error-lighter); color: var(--error-dark);
      font-size: 11px; font-weight: 600;
    }

    /* Activity timeline */
    .activity {
      display: flex; flex-direction: column;
      gap: 14px;
    }
    .act-item {
      display: flex; gap: 10px;
      position: relative;
    }
    .act-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--primary-base);
      flex-shrink: 0;
      margin-top: 4px;
      position: relative;
      z-index: 2;
    }
    .act-line {
      position: absolute;
      left: 3px; top: 14px; bottom: -14px;
      width: 2px;
      background: var(--stroke-soft);
      z-index: 1;
    }
    .act-item:last-child .act-line { display: none; }
    .act-body { flex: 1; min-width: 0; padding-bottom: 0; }
    .act-meta {
      font-size: 11px; color: var(--text-sub);
      margin-bottom: 2px;
    }
    .act-meta b { color: var(--text-strong); font-weight: 600; }
    .act-title { font-size: 12px; color: var(--text-strong); font-weight: 500; }

    /* Form fields */
    .merlin-text-field, .merlin-dropdown {
      display: flex; flex-direction: column; gap: 6px;
      margin-bottom: 14px;
    }
    .input-label {
      font-size: 13px; font-weight: 500; color: var(--text-sub);
      display: flex; align-items: center; gap: 4px;
    }
    .input-label .required { color: var(--primary-base); }
    .input-label .optional {
      font-size: 11px; font-weight: 400; color: var(--text-soft); margin-left: 4px;
    }
    .input-wrapper {
      position: relative;
      display: flex; align-items: center; gap: 8px;
      border: 1px solid var(--stroke-soft);
      border-radius: 8px;
      padding: 0 12px;
      background: var(--bg-white);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input-wrapper:focus-within {
      border-color: var(--brand-400);
      box-shadow: 0 0 0 3px rgba(110,55,133,0.08);
    }
    .input-wrapper input,
    .input-wrapper select,
    .input-wrapper textarea {
      flex: 1; border: none; outline: none; background: transparent;
      font-family: var(--font-family); font-size: 14px;
      color: var(--text-strong);
      padding: 11px 0; width: 100%;
    }
    .input-wrapper input::placeholder,
    .input-wrapper textarea::placeholder { color: var(--text-soft); }
    .input-wrapper textarea { resize: none; min-height: 64px; line-height: 1.5; padding-top: 11px; padding-bottom: 11px; }
    .input-wrapper.multiline { align-items: flex-start; }
    .input-wrapper select {
      appearance: none; -webkit-appearance: none; cursor: pointer;
    }
    .input-wrapper select:disabled { color: var(--text-soft); cursor: not-allowed; }
    .input-wrapper .suffix-icon,
    .input-wrapper .prefix-icon {
      width: 18px; height: 18px; color: var(--text-soft); flex-shrink: 0; pointer-events: none;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hint-text { font-size: 11px; color: var(--text-soft); }

    /* Priority chip row (form input) */
    .prio-row {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .prio-opt {
      height: 40px; padding: 0 8px;
      border: 1.5px solid var(--stroke-soft);
      border-radius: 8px;
      background: var(--bg-white);
      font-family: var(--font-family); font-size: 12px; font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: all 0.12s;
    }
    .prio-opt.active.standard {
      background: var(--bg-weak); border-color: var(--text-sub); color: var(--text-strong);
    }
    .prio-opt.active.rush {
      background: var(--yellow-lighter); border-color: var(--yellow-base); color: #86661D;
    }
    .prio-opt.active.emergency {
      background: var(--error-lighter); border-color: var(--error-base); color: var(--error-dark);
    }
    .prio-opt .dot {
      width: 6px; height: 6px; border-radius: 50%; background: currentColor;
    }

    /* WO / Ad-Hoc toggle */
    /* Line items (S5) */
    .lineitem-ro {
      border: 1px solid var(--stroke-soft);
      border-radius: 12px;
      padding: 12px 12px 10px;
      margin-bottom: 10px;
      background: var(--bg-white);
      box-shadow: 0 1px 0 rgba(20,20,40,0.02);
    }
    .liro-top {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .liro-name { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
    .liro-idx {
      flex-shrink: 0;
      width: 22px; height: 22px;
      border-radius: 6px;
      background: var(--brand-50);
      color: var(--primary-base);
      font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      margin-top: 1px;
    }
    .liro-mat {
      font-size: 13px; font-weight: 600;
      color: var(--text-strong);
      line-height: 1.25;
    }
    .liro-sku {
      font-size: 10px; color: var(--text-soft);
      margin-top: 2px;
      letter-spacing: 0.3px;
    }
    .liro-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px dashed var(--stroke-soft);
    }
    .liro-cell { display: flex; flex-direction: column; }
    .liro-k {
      font-size: 9px; color: var(--text-soft);
      text-transform: uppercase; letter-spacing: 0.4px;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .liro-v {
      font-size: 13px; color: var(--text-strong); font-weight: 600;
    }
    .liro-v small { font-size: 10px; color: var(--text-sub); font-weight: 500; margin-left: 1px; }
    .liro-cell-total { text-align: right; }
    .liro-cell-total .liro-v { color: var(--primary-base); }

    .li-empty {
      padding: 22px 16px;
      border: 1.5px dashed var(--stroke-soft);
      border-radius: 12px;
      background: var(--bg-weak);
      text-align: center;
      color: var(--text-sub);
      margin-bottom: 10px;
    }
    .li-empty svg { color: var(--text-soft); margin-bottom: 6px; }
    .li-empty-t { font-size: 13px; font-weight: 600; color: var(--text-strong); }
    .li-empty-s { font-size: 11px; color: var(--text-soft); margin-top: 3px; }

    /* Legacy line items (kept for compat) */
    .lineitem {
      border: 1px solid var(--stroke-soft);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      background: var(--bg-white);
      position: relative;
    }
    .li-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .li-num { font-size: 11px; color: var(--text-soft); font-weight: 600; }
    .li-remove {
      width: 24px; height: 24px;
      border: none; background: var(--bg-weak);
      border-radius: 6px;
      color: var(--text-sub);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .li-remove:active { background: var(--error-lighter); color: var(--error-dark); }
    .li-material { margin-bottom: 8px; }
    .li-material .input-wrapper input { font-size: 13px; }
    .li-grid {
      display: grid; grid-template-columns: 80px 1fr 100px;
      gap: 8px; align-items: end;
      margin-bottom: 8px;
    }
    .li-mini-label {
      font-size: 10px; color: var(--text-soft);
      text-transform: uppercase; letter-spacing: 0.4px;
      font-weight: 600;
      margin-bottom: 4px;
      display: block;
    }
    .li-uom {
      height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-weak);
      border-radius: 6px;
      font-size: 12px; font-weight: 600; color: var(--text-sub);
    }
    .li-price-input {
      width: 100%; height: 36px;
      border: 1px solid var(--stroke-soft); border-radius: 6px;
      padding: 0 8px;
      font-family: var(--font-family); font-size: 13px;
      color: var(--text-strong);
      text-align: right;
      outline: none;
      background: var(--bg-white);
    }
    .li-price-input:focus { border-color: var(--brand-400); }
    .li-total-row {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 8px;
      border-top: 1px dashed var(--stroke-soft);
      font-size: 13px;
    }
    .li-total-row .lbl { color: var(--text-sub); font-weight: 500; }
    .li-total-row .val { color: var(--text-strong); font-weight: 700; }
    .add-line-btn {
      width: 100%; height: 40px;
      border: 1.5px dashed var(--stroke-sub);
      border-radius: 10px;
      background: var(--bg-weak);
      color: var(--primary-base);
      font-family: var(--font-family); font-size: 13px; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.12s;
    }
    .add-line-btn:active { background: var(--info-lighter); border-color: var(--primary-base); }
    .grand-total {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 14px;
      background: var(--bg-weak);
      border: 1px solid var(--stroke-soft);
      border-radius: 10px;
      margin-top: 4px;
    }
    .grand-total .lbl { font-size: 13px; color: var(--text-sub); font-weight: 600; }
    .grand-total .val { font-size: 18px; color: var(--text-strong); font-weight: 700; }

    /* Bottom sheet */
    .scrim {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .scrim.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      background: var(--bg-white);
      border-radius: 20px 20px 0 0;
      z-index: 21;
      transform: translateY(100%);
      transition: transform 0.25s ease-out;
      max-height: 85%;
      display: flex; flex-direction: column;
    }
    .sheet.show { transform: translateY(0); }
    .sheet-handle {
      width: 40px; height: 4px;
      border-radius: 2px;
      background: var(--stroke-sub);
      margin: 10px auto 4px;
      flex-shrink: 0;
    }
    .sheet-hdr {
      padding: 8px 20px 12px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .sheet-title { font-size: 16px; font-weight: 600; color: var(--text-strong); }
    .sheet-close {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: 1px solid var(--stroke-soft);
      background: var(--bg-white);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-sub); cursor: pointer;
    }
    .sheet-body {
      flex: 1; overflow-y: auto;
      padding: 0 20px 20px;
    }
    .sheet-footer {
      padding: 12px 20px 28px;
      border-top: 1px solid var(--stroke-soft);
      display: flex; gap: 10px;
      flex-shrink: 0;
    }

    /* Issue chip grid (exception sheet) */
    .chip-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .chip-opt {
      padding: 10px 12px;
      border: 1.5px solid var(--stroke-soft);
      border-radius: 8px;
      background: var(--bg-white);
      font-family: var(--font-family); font-size: 12px; font-weight: 500;
      color: var(--text-sub);
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: all 0.12s;
    }
    .chip-opt:active { background: var(--bg-weak); }
    .chip-opt.active {
      background: var(--error-lighter); border-color: var(--error-base);
      color: var(--error-dark);
    }
    .chip-opt svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* Delivery item (S6) */
    .deliv-item {
      border: 1px solid var(--stroke-soft);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      background: var(--bg-white);
    }
    .deliv-item.received { border-color: var(--success-light); background: #F8FFFB; }
    .deliv-item.issue { border-color: var(--warning-light); background: #FFFBF6; }
    .di-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .di-info { flex: 1; min-width: 0; }
    .di-name { font-size: 13px; font-weight: 500; color: var(--text-strong); line-height: 1.4; }
    .di-qty { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
    .di-status-seg {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 4px; padding: 3px;
      background: var(--bg-weak); border-radius: 7px;
    }
    .di-status-seg button {
      height: 30px; padding: 0 10px;
      border: none; background: transparent;
      font-family: var(--font-family); font-size: 11px; font-weight: 600;
      color: var(--text-soft);
      border-radius: 5px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .di-status-seg button.received.active {
      background: var(--success-base); color: #fff;
      box-shadow: 0 1px 3px rgba(31,193,107,0.3);
    }
    .di-status-seg button.issue.active {
      background: var(--warning-base); color: #fff;
      box-shadow: 0 1px 3px rgba(250,115,25,0.3);
    }
    .di-issue-detail {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--warning-light);
    }
    .deliv-item.issue .di-issue-detail { display: block; }

    /* Signature pad */
    .sig-pad-wrap {
      border: 1.5px dashed var(--stroke-sub); border-radius: 10px;
      background: var(--bg-weak); position: relative;
      height: 140px; overflow: hidden;
    }
    .sig-pad-wrap canvas {
      width: 100%; height: 100%; display: block; cursor: crosshair;
      touch-action: none;
    }
    .sig-placeholder {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      color: var(--text-soft); font-size: 12px; pointer-events: none;
    }
    .sig-pad-wrap.signed { border-style: solid; border-color: var(--success-base); background: var(--bg-white); }
    .sig-pad-wrap.signed .sig-placeholder { display: none; }
    .sig-actions {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 6px;
    }
    .sig-clear {
      background: none; border: none; color: var(--primary-base);
      font-family: var(--font-family); font-size: 12px; font-weight: 600;
      cursor: pointer; padding: 4px 0;
    }
    .sig-stamp { font-size: 11px; color: var(--text-sub); }
    .sig-stamp.signed { color: var(--success-dark); font-weight: 500; }

    /* Toast */
    .toast {
      position: absolute;
      left: 50%; bottom: 120px;
      transform: translateX(-50%) translateY(100px);
      background: var(--text-strong); color: #fff;
      padding: 12px 18px; border-radius: 12px;
      font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 8px;
      z-index: 50;
      opacity: 0;
      transition: all 0.3s ease-out;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      pointer-events: none;
      max-width: 320px;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .toast .icon {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--success-base); color: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .toast.warning .icon { background: var(--warning-base); }
    .toast.info .icon { background: var(--primary-base); }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 50px 30px 20px;
      color: var(--text-sub);
    }
    .empty-illus {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: var(--info-lighter); color: var(--primary-base);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
    }
    .empty-title {
      font-size: 14px; font-weight: 600; color: var(--text-strong);
      margin-bottom: 4px;
    }
    .empty-sub { font-size: 12px; color: var(--text-sub); line-height: 1.5; }

    /* "Remainder of" badge */
    .remainder-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 6px; border-radius: 4px;
      font-size: 10px; font-weight: 500;
      background: var(--purple-lighter); color: #4C25A7;
    }

    /* Tab header (top of root screens) */
    .root-hdr {
      padding: 4px 20px 12px;
      display: flex; align-items: center;
      gap: 10px;
      flex-shrink: 0;
      background: var(--bg-white);
    }
    .root-hdr-titles { flex: 1; min-width: 0; }
    .root-hdr-title { font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.5px; line-height: 1.15; }
    .root-hdr-sub { font-size: 12px; color: var(--text-soft); margin-top: 3px; font-weight: 500; }
    .root-hdr-back {
      width: 36px; height: 36px;
      border-radius: 10px;
      border: 1px solid var(--stroke-soft);
      background: var(--bg-white);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-sub); cursor: pointer;
      flex-shrink: 0;
    }
    .root-hdr-back:active { background: var(--bg-weak); }
    .root-hdr-action {
      width: 36px; height: 36px;
      border-radius: 10px;
      border: 1px solid var(--stroke-soft);
      background: var(--bg-white);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-sub); cursor: pointer;
      flex-shrink: 0;
    }
    .root-hdr-cta {
      height: 36px;
      padding: 0 12px 0 10px;
      border-radius: 18px;
      background: linear-gradient(135deg, #6E3785 0%, #5D2F70 60%, #4C285B 100%);
      color: #fff;
      border: none;
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--font-family); font-size: 12px; font-weight: 600;
      letter-spacing: -0.1px;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.12) inset,
        0 4px 10px rgba(93,47,112,0.28);
      transition: transform 0.12s, box-shadow 0.15s;
    }
    .root-hdr-cta:active { transform: scale(0.96); }
    .root-hdr-cta svg { stroke: currentColor; }

    /* ============================================================
       NAVIGATION
       ============================================================ */
    const navStack = ['picks'];
    let currentScreen = 'picks';

    function showScreen(name, isBack = false) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const el = document.getElementById('screen-' + name);
      if (!el) return;
      el.classList.add('active');
      if (!isBack && currentScreen !== name) navStack.push(name);
      currentScreen = name;
      // Sync bottom tab active state on root screens
      ['picks', 'orders', 'shipments'].forEach(r => {
        const screen = document.getElementById('screen-' + r);
        if (!screen) return;
        screen.querySelectorAll('.bottom-tab-bar .tab').forEach(t => {
          t.classList.toggle('active', t.dataset.tab === name);
        });
      });
      // Re-render on entry for live data
      if (name === 'picks') renderPicks();
      if (name === 'orders') renderOrders();
      if (name === 'shipments') renderShipments();
    }

    function goBack() {
      if (navStack.length > 1) {
        navStack.pop();
        showScreen(navStack[navStack.length - 1], true);
      } else {
        showScreen('orders', true);
      }
    }

    function goTab(name) {
      // Root tabs always reset the stack
      navStack.length = 0;
      navStack.push(name);
      showScreen(name);
    }

    // Exit Pick & Pack back to the parent app dashboard (prototype-only stub).
    function exitToApp() {
      showToast('Back to app dashboard — prototype only', 'info');
    }

    /* ============================================================
       SCREEN 1: PICK QUEUE
       ============================================================ */
    let pickTab = 'to-pick';

    function setPickTab(t) {
      pickTab = t;
      document.querySelectorAll('#pickSeg .seg-opt').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === t);
      });
      renderPicks();
    }

    function pickProgress(pl) {
      const totalLines = pl.items.length;
      const doneLines = pl.items.filter(i => i.picked >= i.need || i.flag).length;
      const totalQty = pl.items.reduce((s, i) => s + i.need, 0);
      const pickedQty = pl.items.reduce((s, i) => s + Math.min(i.picked, i.need), 0);
      return { totalLines, doneLines, totalQty, pickedQty, pct: totalQty ? Math.round(pickedQty / totalQty * 100) : 0 };
    }

    function renderPicks() {
      const toPick = STATE.pickLists.filter(p => p.status !== 'DONE');
      const completed = STATE.pickLists.filter(p => p.status === 'DONE');
      document.getElementById('cntToPick').textContent = toPick.length;
      document.getElementById('cntCompleted').textContent = completed.length;
      document.getElementById('picksHdrSub').textContent =
        (pickTab === 'to-pick'
          ? `${toPick.length} pick list${toPick.length !== 1 ? 's' : ''} waiting`
          : `${completed.length} completed`);
      const list = pickTab === 'to-pick' ? toPick : completed;
      const root = document.getElementById('pickList');
      if (!list.length) {
        root.innerHTML = emptyState('picks',
          pickTab === 'to-pick' ? 'Nothing in your pick queue' : 'No completed picks yet',
          pickTab === 'to-pick' ? 'New pick lists will appear here when a fulfillment order moves to In Pick.' : 'Complete a pick list and it will show up here.');
        return;
      }
      root.innerHTML = list.map(pl => {
        const fo = STATE.fos.find(f => f.id === pl.foId);
        const prio = fo ? fo.priority : 'STANDARD';
        const p = pickProgress(pl);
        const statusPill = pl.status === 'DONE'
          ? `<span class="status-pill green"><span class="dot"></span>DONE</span>`
          : pl.status === 'IN_PROGRESS'
            ? `<span class="status-pill blue"><span class="dot"></span>IN PROGRESS</span>`
            : `<span class="status-pill gray"><span class="dot"></span>ASSIGNED</span>`;
        const footerLine = pickTab === 'completed'
          ? `<div class="card-meta">
               <span><b style="color: var(--text-strong); font-weight: 600;">${p.pickedQty} / ${p.totalQty}</b> qty · ${p.totalLines} line${p.totalLines !== 1 ? 's' : ''}</span>
               <span style="color: var(--success-dark); font-weight: 600;">
                 <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -1px;"><polyline points="20 6 9 17 4 12"/></svg>
                 Picked
               </span>
             </div>`
          : `<div class="card-meta">
               <span><b style="color: var(--text-strong); font-weight: 600;">${p.totalLines}</b> line${p.totalLines !== 1 ? 's' : ''} · <b style="color: var(--text-strong); font-weight: 600;">${p.totalQty}</b> qty to pick</span>
               <span style="color: var(--text-soft);">${fo && fo.needBy ? 'Need by ' + fo.needBy : ''}</span>
             </div>`;
        return `
          <div class="card" onclick="openPickList('${pl.id}')">
            <div class="card-row1">
              <span class="card-id">${pl.id}</span>
              <span class="prio-chip ${prio.toLowerCase()}">${titleCase(prio)}</span>
              <span style="flex:1"></span>
              ${statusPill}
            </div>
            <div class="card-project">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              ${pl.project}
            </div>
            <div class="card-meta" style="border: none; padding-top: 0; margin-top: 2px;">
              <span>FO ${pl.foId} · ${pl.picker}</span>
            </div>
            ${footerLine}
          </div>`;
      }).join('');
    }

    let activePickId = null;

    function openPickList(id) {
